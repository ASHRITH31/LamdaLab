<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LambdaLab 3D — Global Subsea Infrastructure</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js and Globe.GL -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function LambdaLabGlobe() {
      const globeEl = useRef(null);
      const worldRef = useRef(null);
      
      const [search, setSearch] = useState('');
      const [hovered, setHovered] = useState(null);
      const [popsData, setPopsData] = useState([]);
      const [cablesData, setCablesData] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        // 1. Initialize 3D Globe WebGL Canvas
        const world = Globe()(globeEl.current)
          .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
          .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
          .pointLat('lat')
          .pointLng('lng')
          .pointColor(() => '#00F0FF')
          .pointRadius(0.3)
          .pointAltitude(0.015)
          .pathPoints(d => d.coords)
          .pathPointLat(p => p[1])
          .pathPointLng(p => p[0])
          .pathColor(d => d.color || '#38bdf8')
          .pathStroke(1.2)
          .pathDashLength(0.1)
          .pathDashGap(0.008)
          .pathDashAnimateTime(12000);

        // Store world reference for search manipulation
        worldRef.current = world;

        // Auto rotation settings
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.4;
        world.pointOfView({ lat: 20.0, lng: 70.0, altitude: 2.2 });

        // Event Listeners for Hover Tooltips
        world.onPointHover(point => setHovered(point ? { ...point, type: 'pop' } : null));
        world.onPointClick(point => {
          world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.8 }, 1200);
          world.controls().autoRotate = false;
        });

        world.onPathHover(path => setHovered(path ? { ...path, type: 'cable' } : null));

        // 2. Fetch Real-World Subsea Cables & Landing Points from TeleGeography
        Promise.all([
          fetch('https://raw.githubusercontent.com/telegeography/submarine-cable-map-data/master/public/api/v3/landing-point/landing-point-geo.json').then(r => r.json()),
          fetch('https://raw.githubusercontent.com/telegeography/submarine-cable-map-data/master/public/api/v3/cable/cable-geo.json').then(r => r.json())
        ]).then(([landingGeo, cableGeo]) => {

          // Parse Landing Station PoPs
          const parsedPops = landingGeo.features.map(f => ({
            id: f.properties.id,
            name: f.properties.name,
            lat: f.geometry.coordinates[1],
            lng: f.geometry.coordinates[0]
          }));

          // Parse Subsea Cables
          const parsedCables = cableGeo.features.map(f => {
            // Flatten multilinestring coordinates
            const lines = f.geometry.type === 'MultiLineString' 
              ? f.geometry.coordinates 
              : [f.geometry.coordinates];
            
            return {
              id: f.properties.id,
              name: f.properties.name,
              color: f.properties.color || '#00F0FF',
              coords: lines.flat()
            };
          });

          setPopsData(parsedPops);
          setCablesData(parsedCables);

          // Update Globe with Real Data
          world.pointsData(parsedPops);
          world.pathsData(parsedCables);
          setLoading(false);
        }).catch(err => {
          console.error("Error loading subsea data:", err);
          setLoading(false);
        });

      }, []);

      // Search Handling Logic
      const handleSearch = (e) => {
        e.preventDefault();
        if (!search.trim() || !worldRef.current) return;

        const query = search.toLowerCase().trim();
        
        // 1. Search Landing Point / PoP Name
        const foundPoP = popsData.find(p => p.name.toLowerCase().includes(query));
        
        if (foundPoP) {
          worldRef.current.pointOfView({ lat: foundPoP.lat, lng: foundPoP.lng, altitude: 0.7 }, 1500);
          worldRef.current.controls().autoRotate = false;
          setHovered({ ...foundPoP, type: 'pop' });
          return;
        }

        // 2. Search Subsea Cable Name
        const foundCable = cablesData.find(c => c.name.toLowerCase().includes(query));
        if (foundCable && foundCable.coords.length > 0) {
          const midPoint = foundCable.coords[Math.floor(foundCable.coords.length / 2)];
          worldRef.current.pointOfView({ lat: midPoint[1], lng: midPoint[0], altitude: 1.2 }, 1500);
          worldRef.current.controls().autoRotate = false;
          setHovered({ ...foundCable, type: 'cable' });
        }
      };

      const resetCamera = () => {
        if (worldRef.current) {
          worldRef.current.pointOfView({ lat: 20.0, lng: 70.0, altitude: 2.2 }, 1200);
          worldRef.current.controls().autoRotate = true;
          setHovered(null);
        }
      };

      return (
        <div className="relative w-screen h-screen">
          {/* Header & Controls Overlay */}
          <div className="absolute top-6 left-8 z-10 max-w-sm">
            <div className="flex items-center gap-2">
              <h1 className="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">
                LambdaLab
              </h1>
              {loading && <span className="text-xs text-amber-400 animate-pulse font-mono">Loading Data...</span>}
            </div>
            
            <p className="text-xs text-slate-400 mt-1">
              Section 1: Real-World Interactive Subsea Cable Globe
            </p>

            {/* Search Box */}
            <form onSubmit={handleSearch} className="mt-4 flex gap-2">
              <input
                type="text"
                placeholder="Search PoP or Cable (e.g., Chennai, SMW6)..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full px-4 py-2 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 shadow-2xl backdrop-blur-md"
              />
              <button 
                type="submit"
                className="px-3 py-2 bg-cyan-600 hover:bg-cyan-500 text-xs text-white font-semibold rounded-xl transition-all shadow-lg"
              >
                Go
              </button>
            </form>

            <button 
              onClick={resetCamera}
              className="mt-2 text-[10px] text-slate-400 hover:text-cyan-400 underline transition-all"
            >
              Reset Camera View
            </button>
          </div>

          {/* Hover Tooltip Overlay */}
          {hovered && (
            <div className="absolute bottom-8 left-8 z-10 p-4 bg-slate-900/95 border border-cyan-500/40 rounded-2xl shadow-2xl max-w-xs backdrop-blur-md animate-in fade-in duration-200">
              <div className="text-xs text-cyan-400 font-semibold uppercase tracking-wider mb-1">
                {hovered.type === 'pop' ? '⚡ Landing Station / PoP' : '🌊 Subsea Cable Route'}
              </div>
              <h3 className="text-base font-bold text-white">{hovered.name}</h3>
              {hovered.lat && (
                <p className="text-xs text-slate-400 font-mono mt-1">
                  Coords: {hovered.lat.toFixed(2)}°, {hovered.lng.toFixed(2)}°
                </p>
              )}
            </div>
          )}

          {/* 3D Earth Render Container */}
          <div ref={globeEl} className="w-full h-full" />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LambdaLabGlobe />);
  </script>
</body>
</html>

    ReactDOM.createRoot(document.getElementById('root')).render(<LambdaLabGlobe />);
  </script>
</body>
</html>
