<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LambdaLab 3D — Global Subsea Infrastructure</title>
  
  <!-- Load Tailwind CSS for Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load React, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Load Three.js and Globe.GL -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Sample Data Layer (Cable Spans & PoP Landing Stations) ---
    const POPS = [
      { id: 'pop-mrs', name: 'Marseille SLTE / PoP', country: 'France', lat: 43.2965, lng: 5.3698, size: 0.8 },
      { id: 'pop-bom', name: 'Mumbai Landing Station', country: 'India', lat: 18.96, lng: 72.82, size: 0.9 },
      { id: 'pop-nyc', name: 'New York City PoP', country: 'USA', lat: 40.7128, lng: -74.006, size: 0.8 },
      { id: 'pop-sin', name: 'Singapore Changi PoP', country: 'Singapore', lat: 1.3521, lng: 103.8198, size: 0.8 },
      { id: 'pop-lis', name: 'Lisbon Landing Station', country: 'Portugal', lat: 38.7223, lng: -9.1393, size: 0.7 }
    ];

    const CABLES = [
      {
        id: 'cable-amitie',
        name: 'Amitie Subsea Cable',
        capacity: '320 Tbps',
        operators: 'Meta, Microsoft, Vodafone, Aqua Comms',
        coords: [{ lat: 40.7128, lng: -74.006 }, { lat: 38.7223, lng: -9.1393 }],
        color: '#00F0FF'
      },
      {
        id: 'cable-smw5',
        name: 'SEA-ME-WE 5',
        capacity: '24 Tbps',
        operators: 'Bharti Airtel, Telecom Egypt, Orange, Singtel',
        coords: [{ lat: 43.2965, lng: 5.3698 }, { lat: 18.96, lng: 72.82 }],
        color: '#FF007A'
      },
      {
        id: 'cable-aae1',
        name: 'AAE-1 Subsea Cable',
        capacity: '40 Tbps',
        operators: 'China Unicom, PCCW Global, Telecom Egypt',
        coords: [{ lat: 18.96, lng: 72.82 }, { lat: 1.3521, lng: 103.8198 }],
        color: '#39FF14'
      }
    ];

    function LambdaLabGlobe() {
      const globeEl = useRef(null);
      const [search, setSearch] = useState('');
      const [hovered, setHovered] = useState(null);

      useEffect(() => {
        // Initialize 3D Globe WebGL Container
        const world = Globe()(globeEl.current)
          .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
          .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
          
          // Render PoP Landing Stations (Points)
          .pointsData(POPS)
          .pointLat('lat')
          .pointLng('lng')
          .pointColor(() => '#00F0FF')
          .pointRadius('size')
          .pointAltitude(0.02)
          .onPointHover(point => setHovered(point ? { ...point, type: 'pop' } : null))
          .onPointClick(point => {
            world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.0 }, 1200);
          })

          // Render Subsea Cable Paths (Light Pulses)
          .pathsData(CABLES.map(c => c.coords))
          .pathPoints(d => d)
          .pathPointLat(p => p.lat)
          .pathPointLng(p => p.lng)
          .pathColor(path => {
            const cable = CABLES.find(c => c.coords === path);
            return cable ? cable.color : '#ffffff';
          })
          .pathStroke(2)
          .pathDashLength(0.1)
          .pathDashGap(0.008)
          .pathDashAnimateTime(10000)
          .onPathHover(path => {
            const cable = CABLES.find(c => c.coords === path);
            setHovered(cable ? { ...cable, type: 'cable' } : null);
          });

        // Camera Setup
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
        world.pointOfView({ lat: 25.0, lng: -30.0, altitude: 2.2 });
      }, []);

      const handleSearch = (e) => {
        e.preventDefault();
        const target = POPS.find(p => p.name.toLowerCase().includes(search.toLowerCase()));
        if (target && globeEl.current) {
          // Camera zoom to searched location
          const world = Globe()(globeEl.current);
        }
      };

      return (
        <div className="relative w-screen h-screen">
          {/* Header Bar */}
          <div className="absolute top-6 left-8 z-10 max-w-sm">
            <h1 className="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">
              LambdaLab
            </h1>
            <p className="text-xs text-slate-400 mt-1">
              Section 1: Interactive Subsea Cable Globe & PoP Telemetry
            </p>

            {/* Search Input */}
            <form onSubmit={handleSearch} className="mt-4">
              <input
                type="text"
                placeholder="Search PoP (e.g. Marseille, Mumbai)..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full px-4 py-2 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 shadow-2xl backdrop-blur-md"
              />
            </form>
          </div>

          {/* Hover Metadata Tooltip Card */}
          {hovered && (
            <div className="absolute bottom-8 left-8 z-10 p-4 bg-slate-900/95 border border-cyan-500/40 rounded-2xl shadow-2xl max-w-xs backdrop-blur-md animate-in fade-in duration-200">
              <div className="text-xs text-cyan-400 font-semibold uppercase tracking-wider mb-1">
                {hovered.type === 'pop' ? '⚡ Point of Presence (PoP)' : '🌊 Subsea Cable Route'}
              </div>
              <h3 className="text-base font-bold text-white">{hovered.name}</h3>
              {hovered.country && <p className="text-xs text-slate-300 mt-1">Location: {hovered.country}</p>}
              {hovered.capacity && <p className="text-xs text-emerald-400 font-mono mt-1">Design Cap: {hovered.capacity}</p>}
              {hovered.operators && <p className="text-xs text-slate-400 mt-1">Consortium: {hovered.operators}</p>}
            </div>
          )}

          {/* WebGL Canvas Container */}
          <div ref={globeEl} className="w-full h-full" />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LambdaLabGlobe />);
  </script>
</body>
</html>
