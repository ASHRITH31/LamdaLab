<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LambdaLab 3D — Subsea & PoP Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.28.0/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Guaranteed Fallback Hubs (Ensures search works 100% of the time)
    const CORE_POPS = [
      { name: "Mumbai, India", lat: 18.96, lng: 72.82 },
      { name: "Chennai, India", lat: 13.08, lng: 80.27 },
      { name: "Marseille, France", lat: 43.29, lng: 5.36 },
      { name: "Singapore", lat: 1.35, lng: 103.81 },
      { name: "Fujairah, UAE", lat: 25.12, lng: 56.32 },
      { name: "Jeddah, Saudi Arabia", lat: 21.54, lng: 39.17 },
      { name: "New York, USA", lat: 40.71, lng: -74.00 },
      { name: "London, UK", lat: 51.50, lng: -0.12 },
      { name: "Tokyo, Japan", lat: 35.67, lng: 139.65 }
    ];

    function App() {
      const globeContainer = useRef(null);
      const worldInstance = useRef(null);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [allPops, setAllPops] = useState(CORE_POPS);
      const [results, setResults] = useState([]);
      const [activeSelection, setActiveSelection] = useState(null);
      const [status, setStatus] = useState("Initializing WebGL...");

      useEffect(() => {
        // Build Globe instance safely
        const world = Globe()(globeContainer.current)
          .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
          .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
          .pointLat('lat')
          .pointLng('lng')
          .pointColor(() => '#00F0FF')
          .pointRadius(0.5)
          .pointAltitude(0.02)
          .pointsData(CORE_POPS);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
        world.pointOfView({ lat: 19.07, lng: 72.87, altitude: 2.0 }); // Default view centered near India/Indian Ocean
        
        world.onPointClick(pt => flyTo(pt.lat, pt.lng, pt.name));
        worldInstance.current = world;

        // Fetch expanded open-source landing points
        fetch('https://cdn.jsdelivr.net/gh/telegeography/submarine-cable-map-data@master/public/api/v3/landing-point/landing-point-geo.json')
          .then(res => res.json())
          .then(data => {
            const fetchedPops = data.features.map(f => ({
              name: f.properties.name || 'Landing Station',
              lat: f.geometry.coordinates[1],
              lng: f.geometry.coordinates[0]
            }));
            setAllPops(fetchedPops);
            world.pointsData(fetchedPops);
            setStatus("Global Data Active");
          })
          .catch(err => {
            console.log("Using core POP dataset", err);
            setStatus("Core Hubs Active");
          });
      }, []);

      const handleSearch = (e) => {
        const query = e.target.value;
        setSearchQuery(query);

        if (query.trim().length > 0) {
          const matches = allPops
            .filter(p => p.name.toLowerCase().includes(query.toLowerCase()))
            .slice(0, 6);
          setResults(matches);
        } else {
          setResults([]);
        }
      };

      const flyTo = (lat, lng, name) => {
        if (worldInstance.current) {
          worldInstance.current.controls().autoRotate = false;
          worldInstance.current.pointOfView({ lat, lng, altitude: 0.6 }, 1400);
          setActiveSelection({ name, lat, lng });
          setResults([]);
        }
      };

      return (
        <div className="relative w-screen h-screen">
          {/* Header Overlay */}
          <div className="absolute top-6 left-6 z-20 w-80">
            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
              LambdaLab
            </h1>
            <p className="text-[11px] text-slate-400 mt-0.5">
              Section 1: Interactive Cable & PoP Explorer
            </p>

            {/* Search Input */}
            <div className="relative mt-3">
              <input
                type="text"
                placeholder="Type location (e.g. Mumbai, Chennai, Marseille)..."
                value={searchQuery}
                onChange={handleSearch}
                className="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 backdrop-blur-md shadow-2xl"
              />

              {/* Instant Dropdown Results */}
              {results.length > 0 && (
                <div className="absolute left-0 right-0 mt-1 bg-slate-900/95 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-30 max-h-52 overflow-y-auto">
                  {results.map((item, idx) => (
                    <button
                      key={idx}
                      onClick={() => flyTo(item.lat, item.lng, item.name)}
                      className="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-cyan-950/80 hover:text-cyan-300 border-b border-slate-800/60 last:border-0 transition-colors"
                    >
                      📍 {item.name}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="mt-2 flex items-center justify-between text-[10px] text-slate-500">
              <span>Status: <strong className="text-cyan-400">{status}</strong></span>
              <button 
                onClick={() => {
                  worldInstance.current.pointOfView({ lat: 20, lng: 70, altitude: 2.0 }, 1000);
                  worldInstance.current.controls().autoRotate = true;
                  setActiveSelection(null);
                  setSearchQuery('');
                }}
                className="hover:text-cyan-400 underline"
              >
                Reset Camera
              </button>
            </div>
          </div>

          {/* Active Location Card */}
          {activeSelection && (
            <div className="absolute bottom-6 left-6 z-20 p-4 bg-slate-900/95 border border-cyan-500/40 rounded-2xl shadow-2xl max-w-xs backdrop-blur-md">
              <span className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">
                ⚡ Point of Presence (PoP)
              </span>
              <h3 className="text-sm font-bold text-white mt-1">{activeSelection.name}</h3>
              <p className="text-[11px] text-slate-400 font-mono mt-1">
                Lat: {activeSelection.lat.toFixed(2)}° | Lng: {activeSelection.lng.toFixed(2)}°
              </p>
            </div>
          )}

          {/* WebGL Canvas */}
          <div ref={globeContainer} className="w-full h-full" />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
